openapi: 3.0.3
info:
  title: School Election API
  version: 1.0.0
  description: >-
    Versioned JSON contract for the separate frontend. Operations marked planned
    are design targets, not available routes. Their payloads remain draft until
    the corresponding feature is implemented and covered by request tests.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API liveness and version
      description: Liveness only; this response does not certify database readiness.
      x-implementation-status: implemented
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/v1/auth/session:
    get:
      operationId: getUserSession
      summary: Read the current user session and CSRF token
      x-implementation-status: implemented
      x-authentication: optional-user-session
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate a creator or poll worker
      x-implementation-status: implemented
      x-authentication: anonymous-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: End the current user session
      x-implementation-status: implemented
      x-authentication: user-session-with-csrf
      responses:
        '204':
          description: Session ended
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections:
    get:
      operationId: listElections
      summary: List elections visible to the authenticated creator
      x-implementation-status: planned
      x-authentication: creator-session
      responses:
        '200':
          description: Election summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Election'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createElection
      summary: Create a draft election
      x-implementation-status: planned
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionDraft'
      responses:
        '201':
          description: Created election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getElection
      summary: Read an election configuration
      x-implementation-status: planned
      x-authentication: creator-session
      responses:
        '200':
          description: Election configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
        default:
          $ref: '#/components/responses/ApiError'
    patch:
      operationId: updateElection
      summary: Update an election that has not opened
      x-implementation-status: planned
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionDraft'
      responses:
        '200':
          description: Updated election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewElection
      summary: Validate the ballot before opening a round
      x-implementation-status: planned
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: Ordered stages and configuration problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectionPreview'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/rounds/{id}/open:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: openRound
      summary: Freeze a valid round configuration and open consecutive voting stages
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: Opened round state, snapshot digest and ordered stages
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/rounds/{id}/close:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: closeRound
      summary: Close after the grace period and persist reconciled tallies
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: Closed round and final or pending tally states
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/pollworker/voting-devices/{id}/release:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: releaseVotingDevice
      summary: Release one anonymous voting session after physical identity check
      x-implementation-status: implemented
      x-authentication: poll-worker-session-with-csrf
      responses:
        '200':
          description: Current operational session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingDeviceSession'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/voting-device/state:
    get:
      operationId: getVotingDeviceState
      summary: Recover authoritative voting device state after release or reconnection
      x-implementation-status: implemented
      x-authentication: voting-device-credential
      responses:
        '200':
          description: Voting device state without a previously confirmed choice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingDeviceState'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/voting-device/confirmations:
    post:
      operationId: confirmVote
      summary: Confirm exactly one voting stage
      x-implementation-status: implemented
      x-authentication: voting-device-credential-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationIntent'
      responses:
        '200':
          description: Durable confirmation or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationReceipt'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/public/elections/{id}/partial:
    get:
      operationId: getPartialResults
      summary: Read aggregate partial counts without a winner
      x-implementation-status: implemented
      x-authentication: public
      responses:
        '200':
          description: Aggregate partial results
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/ApiError'

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Stable JSON error; the HTTP status identifies the failure class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: Resource not found
            details:
              type: array
              items:
                type: object
    Health:
      type: object
      required: [status, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        api_version:
          type: string
          enum: [v1]
    UserSession:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            login:
              type: string
        csrf_token:
          type: string
          description: Provided for same-origin mutating requests; never a login credential.
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    ElectionDraft:
      type: object
      required: [title, timezone]
      properties:
        title:
          type: string
        description:
          type: string
        timezone:
          type: string
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        configuration_version:
          type: integer
          description: Required for updates once optimistic concurrency is implemented.
    Election:
      allOf:
        - $ref: '#/components/schemas/ElectionDraft'
        - type: object
          required: [id, state]
          properties:
            id:
              type: string
            state:
              type: string
    ElectionPreview:
      type: object
      required: [stages, problems]
      properties:
        stages:
          type: array
          items:
            type: object
        problems:
          type: array
          items:
            type: object
    VotingDeviceSession:
      type: object
      required: [session_id, state]
      properties:
        session_id:
          type: string
          format: uuid
        state:
          type: string
    VotingDeviceState:
      type: object
      required: [state]
      properties:
        state:
          type: string
        session_id:
          type: string
          nullable: true
        next_stage_position:
          type: integer
          nullable: true
        stage:
          type: object
          nullable: true
        last_receipt_id:
          type: string
          format: uuid
          nullable: true
    ConfirmationIntent:
      type: object
      required: [stage_id, command_key, kind]
      properties:
        stage_id:
          type: integer
        command_key:
          type: string
        kind:
          type: string
          enum: [nominal, legend, blank, 'null']
        candidacy_id:
          type: integer
        party_id:
          type: integer
        warning_acknowledged:
          type: boolean
    ConfirmationReceipt:
      type: object
      required: [receipt_id, status]
      properties:
        receipt_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [confirmed]
        next_stage_position:
          type: integer
