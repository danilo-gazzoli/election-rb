openapi: 3.0.3
info:
  title: School Election API
  version: 1.0.0
  description: >-
    Versioned JSON contract for the separate frontend. Operations marked planned
    are design targets, not available routes. Their payloads remain draft until
    the corresponding feature is implemented and covered by request tests.
servers:
  - url: /
x-user-session:
  absolute_timeout_seconds: 28800
  renew_on_activity: false
  cookie:
    http_only: true
    same_site: Lax
    secure_in_production: true
  description: >-
    Opaque session cookie; obtain the CSRF token through GET /api/v1/auth/session
    and send X-CSRF-Token with every mutation. Login resets the session and token.
    The eight-hour deadline belongs to the operator, not the anonymous voter.
    Logout clears the current browser session; it does not revoke every copied
    cookie or disconnect all previously opened operator sockets.
x-rate-limit-policy:
  algorithm: fixed-window
  storage: postgresql
  description: >-
    Counts attempts before executing a command, including unsuccessful attempts.
    Identities are stored as keyed digests. Reads are not counted. Authenticated
    operator and device quotas are independent of IP quotas. Retry the same
    confirmation command_key after Retry-After; never invent another vote.
x-websocket-channels:
  VotingDeviceChannel:
    authentication: voting-device-credential
    scope: device
    message_schema: '#/components/schemas/OperationalStateChanged'
    description: >-
      Uses the paired cookie. The credential is checked on subscription and before
      transmission. Rotation attempts to disconnect existing device connections;
      if that transport fails, subsequent transmissions still recheck the digest.
  PollworkerChannel:
    authentication: user-session
    roles: [creator, pollworker]
    scope: election
    subscription_parameters: [election_id]
    message_schema: '#/components/schemas/OperationalStateChanged'
    description: >-
      Requires the same school and an active election role. Session deadline,
      active account and role are checked on subscription and before transmission.
      Notifications request an authorized HTTP refresh; they contain no choices
      or session identifiers. Device cookies take priority when both identities
      are present; use separate browser contexts for operator and voting device.
  transport:
    protocol: action-cable
    path: /cable
    origin: same-origin
    description: >-
      An adapter must implement the Action Cable subscription envelope. Foreign
      or missing Origin is rejected. Separate frontend source/deployment must
      expose API and WebSocket through the same origin with credentialed cookies.
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API liveness and version
      description: Liveness only; this response does not certify database readiness.
      x-implementation-status: implemented
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/v1/auth/session:
    get:
      operationId: getUserSession
      summary: Read the current user session and CSRF token
      x-implementation-status: implemented
      x-authentication: optional-user-session
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate a creator or poll worker
      x-implementation-status: implemented
      x-authentication: anonymous-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-rate-limits:
        - {scope: login_account, identity: account, attempts: 10, window_seconds: 900}
        - {scope: login_ip, identity: ip, attempts: 30, window_seconds: 900}
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: End the current user session
      x-implementation-status: implemented
      x-authentication: user-session-with-csrf
      responses:
        '204':
          description: Session ended
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/parties:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listElectionParties
      summary: List parties participating in the creator's election
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: Election party catalog with canonical ballot numbers
          content:
            application/json:
              schema:
                type: object
                required: [parties]
                properties:
                  parties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Party'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createElectionParty
      summary: Create a party and its election registration atomically
      description: >-
        Requires a creator role in this election. Creates an election-owned
        record and an audit event. Abbreviation and number are unique within
        this election. Rejects changes after any round opens.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyCreateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Party and registration persisted with an audit event
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/parties/{id}:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateElectionParty
      summary: Edit an owned draft party and synchronize its registration
      description: >-
        Accepts partial party attributes. Requires ownership by this election
        and a creator role. Party, registration and audit event are updated
        atomically. Rejects changes after any round opens.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyUpdateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Updated party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: deleteElectionParty
      summary: Delete an unused owned draft party and its registration
      description: >-
        Requires a creator role. Returns 409 when the catalog is frozen or
        election data reference the party. An audit event survives successful
        deletion; a failure rolls back the complete command.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '204':
          description: Party and registration deleted with an audit event
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/contests:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createContest
      summary: Create a draft contest and affiliated candidacies atomically
      description: >-
        Requires a creator role in this election and registered parties.
        Rejects configuration after a round opens. The server determines the
        election and rule version; clients cannot override these fields.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestConfigurationRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Contest and candidacies persisted with an audit event
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections:
    get:
      operationId: listElections
      summary: List elections with an active creator role in the current school
      x-implementation-status: implemented
      x-authentication: creator-session
      responses:
        '200':
          description: Election configurations visible to this user
          content:
            application/json:
              schema:
                type: object
                required: [elections]
                properties:
                  elections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Election'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createElection
      summary: Atomically create a draft election, agenda, creator role and audit
      description: >-
        Requires an active account provisioned with can_create_elections.
        School and creator are derived from the authenticated user.
        The first-round grace period is ten minutes; all records roll back
        when any input is invalid. This API cannot grant creation permission.
      x-implementation-status: implemented
      x-authentication: provisioned-creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionCreateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Draft election configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getElection
      summary: Read an election configuration and its first-round agenda
      x-implementation-status: implemented
      x-authentication: creator-session
      responses:
        '200':
          description: Election configuration with authoritative round state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
        default:
          $ref: '#/components/responses/ApiError'
    patch:
      operationId: updateElection
      summary: Atomically edit draft metadata and first-round agenda
      description: >-
        Requires a creator role and the current integer configuration_version.
        Stale versions return 409 stale_configuration. An opened, suspended,
        closed or annulled round returns 409 configuration_locked. The agenda,
        legacy calendar fields, version and audit event change atomically.
        Changes to parties and contests also increment this version.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionUpdateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Updated election with its new configuration version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewElection
      summary: Validate the ballot before opening a round
      description: Read-only configuration check, including future schedules. Opening still enforces its time window. Invalid ballots return all identified issues and empty stages, without a snapshot or state change.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Ordered stages and configuration problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectionPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/rounds/{id}/open:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: openRound
      summary: Freeze a valid round configuration and open consecutive voting stages
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Opened round state, snapshot digest and ordered stages
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/rounds/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: suspendRound
      summary: Suspend voting while preserving confirmed votes and session progress
      description: >-
        Requires an active creator of this election and a nonblank textual reason.
        New releases and confirmations are blocked. Previously committed confirmations
        remain recoverable. State, incident and operational audit are persisted atomically.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundTransitionRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Suspended round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundTransitionResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: round_suspend_denied; the round is not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_reason; a nonblank textual reason is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/rounds/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: resumeRound
      summary: Resume the same ballot within the original voting schedule
      description: >-
        Requires an active creator of this election and a nonblank textual reason.
        Only a suspended round can resume, from opens_at inclusive until grace_until
        exclusive. The original schedule is not extended. After closes_at, only
        sessions already started can continue; new releases and starts remain blocked.
        State, incident and operational audit are persisted atomically.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundTransitionRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Resumed round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundTransitionResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: round_resume_denied; incompatible state or original grace period ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_reason; a nonblank textual reason is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/rounds/{id}/annul:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: annulRound
      summary: Annul a round with explicit confirmation and a reason
      description: >-
        Requires an active creator of this election, a nonblank textual reason
        and confirmed equal to the JSON boolean true. Any nonannulled round can
        be annulled. Cancels active sessions and locks their devices without
        generating votes. Preserves votes, receipts, frozen configuration and
        historical tallies for audit. Marks the election cancelled. An annulled
        round cannot declare a winner or be reopened. Audit and operational
        state are persisted atomically. Repeating annulment returns a conflict.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundAnnulmentRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Annulled round; no winner is declared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundTransitionResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: round_annul_denied; round is already annulled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_reason or confirmation_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/rounds/{id}/close:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: closeRound
      summary: Close after the grace period and persist reconciled tallies
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Closed round and final or pending tally states
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/pollworker/voting-devices/{id}/release:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: releaseVotingDevice
      summary: Release one anonymous voting session after physical identity check
      x-implementation-status: implemented
      x-authentication: poll-worker-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Current operational session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingDeviceSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/pollworker/sessions/{id}/abandon:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: abandonVotingSession
      summary: Resolve a formally abandoned session without changing confirmed votes
      description: >-
        Requires an active pollworker or creator role in the election and school,
        and a nonblank textual reason. Confirmed votes and receipts are preserved.
        Started sessions receive administrative nulls only for remaining stages.
        Unstarted releases are cancelled without votes. The operator, reason,
        time and remaining stage identifiers are recorded atomically without choices.
        Repeating a closure does not duplicate votes or evidence. A connection failure
        does not call this command automatically. New abandonment is forbidden in
        a cancelled election.
      x-implementation-status: implemented
      x-authentication: operator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundTransitionRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Original or newly committed session closure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionClosureResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: abandon_denied; completed session or cancelled election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_reason; absent, blank or nontextual reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/voting-device/state:
    get:
      operationId: getVotingDeviceState
      summary: Recover authoritative voting device state after release or reconnection
      x-implementation-status: implemented
      x-authentication: voting-device-credential
      responses:
        '200':
          description: Voting device state without a previously confirmed choice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingDeviceState'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/voting-device/confirmations:
    post:
      operationId: confirmVote
      summary: Confirm exactly one voting stage
      description: >-
        New confirmations are forbidden while suspended, closed, annulled or
        when the election is cancelled. A paired device may recover an exact
        previously committed command from its latest completed session or a
        session cancelled by annulment without creating another vote.
      x-implementation-status: implemented
      x-authentication: voting-device-credential-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationIntent'
      x-rate-limits:
        - {scope: device_confirmations, identity: device, attempts: 120, window_seconds: 60}
      responses:
        '200':
          description: Durable confirmation or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationReceipt'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/public/elections/{id}/partial:
    get:
      operationId: getPartialResults
      summary: Read aggregate partial counts without a winner
      x-implementation-status: implemented
      x-authentication: public
      responses:
        '200':
          description: Aggregate partial results
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/voting-device/pair:
    post:
      operationId: pairVotingDevice
      summary: Consume a one-time code and rotate the opaque device cookie
      description: >-
        Codes expire after ten minutes and can be consumed once. Invalid or expired
        codes return 401 invalid_pairing. A successful pair invalidates the old
        credential and restores an unavailable device to locked. Credentials are
        never returned in JSON. Obtain CSRF through the user session endpoint.
      x-implementation-status: implemented
      x-authentication: anonymous-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_code]
              properties:
                pairing_code:
                  type: string
      x-rate-limits:
        - {scope: pair_ip, identity: ip, attempts: 20, window_seconds: 600}
      responses:
        '200':
          description: Device paired; an encrypted HttpOnly cookie is issued
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/elections/{election_id}/voting-devices:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createVotingDevice
      summary: Register a school device and issue its first one-time pairing code
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_label]
              properties:
                public_label:
                  type: string
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Device created; pairing code is valid for ten minutes
          content:
            application/json:
              schema:
                type: object
                required: [id, public_label, pairing_code]
                properties:
                  id:
                    type: integer
                  public_label:
                    type: string
                  pairing_code:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/voting-devices/{id}/revoke:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: revokeVotingDeviceAccess
      summary: Revoke a school device credential with an audited reason
      description: >-
        Requires an active creator role in the election and a device from the
        same school. Invalidates its credential and pending pairing code, marks
        it unavailable and records the reason atomically. Refuses active voting
        sessions. A transport failure cannot undo the committed revocation.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundTransitionRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Credential revoked; no secrets are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAccessResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: device_busy; an active voting session must finish first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_reason; a nonblank textual reason is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/elections/{election_id}/voting-devices/{id}/pairing-code:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: renewVotingDevicePairingCode
      summary: Issue a new one-time code for an existing school device
      description: >-
        Requires an active creator role and a device from the same school, without
        an active voting session. Invalidates the old credential and pending code,
        marks unavailable and audits renewal without storing the plaintext code.
        The new code expires in ten minutes. A successful pair restores locked.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Pairing code returned once to the authorized creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePairingCodeResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: device_busy; an active voting session must finish first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Stable JSON error; the HTTP status identifies the failure class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: invalid_csrf_token or forbidden; command is not executed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: rate_limited; attempt quota exceeded before command execution
      headers:
        Retry-After:
          description: Seconds until the fixed window resets
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthenticationUnavailable:
      description: >-
        authentication_unavailable; the attempt limiter cannot access its storage.
        The command is not executed. This response does not describe every possible
        database outage elsewhere in the application.
      headers:
        Retry-After:
          description: Suggested seconds before retrying
          schema:
            type: integer
            minimum: 1
            example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OperationalStateChanged:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          type: string
          enum: [state_changed]
    DeviceAccessResult:
      type: object
      required: [id, state]
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [unavailable]
    DevicePairingCodeResult:
      type: object
      required: [id, state, pairing_code, pairing_expires_at]
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [unavailable]
        pairing_code:
          type: string
          description: One-time secret; never log or persist on the client
        pairing_expires_at:
          type: string
          format: date-time
          description: UTC expiry of the ten-minute pairing window
    PartyAttributes:
      type: object
      properties:
        name:
          type: string
          minLength: 10
          maxLength: 50
        abbreviation:
          type: string
          minLength: 2
          maxLength: 8
          pattern: '^[A-Z]+$'
        ballot_number:
          type: string
          pattern: '^(0[1-9]|[1-9][0-9])$'
          description: Canonical two-digit number from 01 through 99.
        description:
          type: string
          nullable: true
          minLength: 15
          maxLength: 500
    Party:
      allOf:
        - $ref: '#/components/schemas/PartyAttributes'
        - type: object
          required: [id, name, abbreviation, ballot_number]
          properties:
            id:
              type: integer
    PartyCreateRequest:
      type: object
      required: [party]
      properties:
        party:
          type: object
          required: [name, abbreviation, ballot_number]
          allOf:
            - $ref: '#/components/schemas/PartyAttributes'
    PartyUpdateRequest:
      type: object
      required: [party]
      properties:
        party:
          $ref: '#/components/schemas/PartyAttributes'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: Resource not found
            details:
              type: array
              items:
                type: object
    Health:
      type: object
      required: [status, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        api_version:
          type: string
          enum: [v1]
    UserSession:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            login:
              type: string
        csrf_token:
          type: string
          description: Provided for same-origin mutating requests; never a login credential.
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    ContestConfigurationRequest:
      type: object
      required: [contest]
      properties:
        contest:
          type: object
          required: [name, position, method, seats, choices_per_person]
          properties:
            name:
              type: string
            position:
              type: integer
              minimum: 1
            method:
              type: string
              enum: [simple_majority, absolute_majority, proportional]
            seats:
              type: integer
              minimum: 1
            choices_per_person:
              type: integer
              minimum: 1
            has_vice:
              type: boolean
              description: This creation operation supports candidacies without a vice.
            candidacies:
              type: array
              items:
                type: object
                required: [principal_name, principal_party_id, ballot_number]
                properties:
                  principal_name:
                    type: string
                  principal_party_id:
                    type: integer
                  ballot_number:
                    type: string
    ElectionAttributes:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 200
        timezone:
          type: string
          description: Recognized Rails or IANA timezone, such as America/Sao_Paulo.
        opens_at:
          type: string
          format: date-time
          description: Future ISO 8601 instant with explicit offset or Z.
        closes_at:
          type: string
          format: date-time
          description: ISO 8601 instant with explicit offset, strictly after opening.
        configuration_version:
          type: integer
          minimum: 1
          description: Required on edits; must match the current configuration version.
    ElectionCreateRequest:
      type: object
      required: [election]
      properties:
        election:
          type: object
          required: [title, description, timezone, opens_at, closes_at]
          allOf:
            - $ref: '#/components/schemas/ElectionAttributes'
    ElectionUpdateRequest:
      type: object
      required: [election]
      properties:
        election:
          type: object
          required: [configuration_version]
          allOf:
            - $ref: '#/components/schemas/ElectionAttributes'
    FirstRoundAgenda:
      type: object
      required: [id, number, opens_at, closes_at, grace_until]
      properties:
        id:
          type: integer
          description: Identifier used by the round opening and closing endpoints.
        number:
          type: integer
          enum: [1]
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        grace_until:
          type: string
          format: date-time
          description: Closing instant plus ten minutes.
    Election:
      type: object
      required: [id, title, description, timezone, state, configuration_version, first_round]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        timezone:
          type: string
        state:
          type: string
          enum: [draft, scheduled, open, suspended, closed, annulled]
        configuration_version:
          type: integer
          minimum: 1
        first_round:
          $ref: '#/components/schemas/FirstRoundAgenda'
    ElectionPreview:
      type: object
      required: [valid, configuration_version, issues, ballot, stages]
      properties:
        valid:
          type: boolean
          description: Configuration validity; does not authorize voting before the opening window.
        configuration_version:
          type: integer
          minimum: 1
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [missing_round, missing_contests, unsupported_profile, insufficient_candidacies, invalid_candidacy, ambiguous_ballot_number, invalid_stage_order]
              message:
                type: string
              contest_id:
                type: integer
              candidacy_id:
                type: integer
        ballot:
          type: object
          nullable: true
          description: Canonical ballot used by opening, or null for an invalid configuration. Contains round_number, rule_version, schedule, parties and ordered contests with candidate identities and affiliations. Contains no votes or voting sessions.
        stages:
          type: array
          items:
            type: object
            required: [contest_id, global_position, choice_index]
            properties:
              contest_id:
                type: integer
              global_position:
                type: integer
                minimum: 1
              choice_index:
                type: integer
                minimum: 1
    RoundAnnulmentRequest:
      type: object
      required: [reason, confirmed]
      properties:
        reason:
          type: string
          minLength: 1
          pattern: '\S'
          description: Nonblank reason recorded in the operational audit.
        confirmed:
          type: boolean
          enum: [true]
          description: Explicit confirmation; strings and numeric values are rejected.
    SessionClosureResult:
      type: object
      required: [session_id, state]
      properties:
        session_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [abandoned, cancelled]
    RoundTransitionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          pattern: '\S'
          description: Operational justification; never include a voter identity or choice.
    RoundTransitionResult:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [open, suspended, annulled]
    VotingDeviceSession:
      type: object
      required: [session_id, state]
      properties:
        session_id:
          type: string
          format: uuid
        state:
          type: string
    VotingDeviceState:
      type: object
      required: [state, round_state]
      properties:
        state:
          type: string
        round_state:
          type: string
          nullable: true
          enum: [draft, scheduled, open, suspended, closed, annulled, null]
          description: Latest session round state; null until the device has a session.
        session_id:
          type: string
          nullable: true
        next_stage_position:
          type: integer
          nullable: true
        stage:
          description: Next stage only for an active session in an open round of a noncancelled election; null while suspended, cancelled or inactive.
          type: object
          nullable: true
        last_receipt_id:
          type: string
          format: uuid
          nullable: true
    ConfirmationIntent:
      type: object
      required: [stage_id, command_key, kind]
      properties:
        stage_id:
          type: integer
        command_key:
          type: string
        kind:
          type: string
          enum: [nominal, legend, blank, 'null']
        candidacy_id:
          type: integer
        party_id:
          type: integer
        warning_acknowledged:
          type: boolean
    ConfirmationReceipt:
      type: object
      required: [receipt_id, status]
      properties:
        receipt_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [confirmed]
        next_stage_position:
          type: integer
