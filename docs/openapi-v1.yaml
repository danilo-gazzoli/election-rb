    post:
      operationId: prepareRunoff
      summary: Prepare only the unresolved absolute majority contests for round two
      description: >-
        Requires the active election creator and a closed, reconciled first round with
        a frozen ballot and matching recorded tally. Opens on a later local day using
        the first ballot timezone, after its grace deadline, with a future opening and
