          description: New scheduled second round and qualified contests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunoffPreparationResult'
        '200':
          description: Replay of the existing round with the same calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunoffPreparationResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
