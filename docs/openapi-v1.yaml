openapi: 3.0.3
info:
  title: School Election API
  version: 1.0.0
  description: >-
    Versioned JSON contract for the separate frontend. Operations marked planned
    are design targets, not available routes. Their payloads remain draft until
    the corresponding feature is implemented and covered by request tests.
servers:
  - url: /
x-user-session:
  absolute_timeout_seconds: 28800
  renew_on_activity: false
  cookie:
    http_only: true
    same_site: Lax
    secure_in_production: true
  description: >-
    Opaque session cookie; obtain the CSRF token through GET /api/v1/auth/session
    and send X-CSRF-Token with every mutation. Login resets the session and token.
    The eight-hour deadline belongs to the operator, not the anonymous voter.
    Logout clears the current browser session; it does not revoke every copied
    cookie or disconnect all previously opened operator sockets.
x-rate-limit-policy:
  algorithm: fixed-window
  storage: postgresql
  description: >-
    Counts attempts before executing a command, including unsuccessful attempts.
    Identities are stored as keyed digests. Reads are not counted. Authenticated
    operator and device quotas are independent of IP quotas. Retry the same
    confirmation command_key after Retry-After; never invent another vote.
x-websocket-channels:
  VotingDeviceChannel:
    authentication: voting-device-credential
    scope: device
    message_schema: '#/components/schemas/OperationalStateChanged'
    description: >-
      Uses the paired cookie. The credential is checked on subscription and before
      transmission. Rotation attempts to disconnect existing device connections;
      if that transport fails, subsequent transmissions still recheck the digest.
  PollworkerChannel:
    authentication: user-session
    roles: [creator, pollworker]
    scope: election
    subscription_parameters: [election_id]
    message_schema: '#/components/schemas/OperationalStateChanged'
    description: >-
      Requires the same school and an active election role. Session deadline,
      active account and role are checked on subscription and before transmission.
      Notifications request an authorized HTTP refresh; they contain no choices
      or session identifiers. Device cookies take priority when both identities
      are present; use separate browser contexts for operator and voting device.
  PublicResultsChannel:
    authentication: public
    scope: election
    connect_path: /cable?audience=public
    x-implementation-status: implemented
    subscription_parameters: [election_id]
    message_schema: '#/components/schemas/PublicResultsChanged'
    description: >-
      Explicit public mode ignores user and device cookies and grants no private
      channel access. Subscription requires an open or suspended election round.
      Refresh hints are sent after commit for confirmed votes, administrative
      nulls from abandonment, closure and annulment. Releases, warnings and
      confirmation replays do not emit a public refresh. Messages contain only
      the election identity and opaque revision, never choices or arrival times.
      Fetch GET /api/v1/public/elections/{id}/partial over HTTP after a message
      and after reconnecting; notifications are best effort and may be missed.
      Compare revisions for equality, not ordering. A terminal invalidation
      requests a refetch returning not_available; it does not publish a public
      report or elected candidates. Explicit publication sends a hint to existing subscriptions
      with the report input_digest; refetch GET /api/v1/public/elections/{id}/report
      after publication or reconnecting to a closed election. Origin must match the application origin.
  transport:
    protocol: action-cable
    path: /cable
    origin: same-origin
    description: >-
      An adapter must implement the Action Cable subscription envelope. Foreign
      or missing Origin is rejected. Separate frontend source/deployment must
      expose API and WebSocket through the same origin with credentialed cookies.
paths:
  /api/v1/readiness:
    get:
      operationId: getDatabaseReadiness
      summary: Check whether the API can reach its database
      x-implementation-status: implemented
      x-authentication: public
      description: >-
        Read-only database connectivity probe for deployment and recovery.
        Returns database_unavailable with HTTP 503 when the database cannot be reached.
        Unlike /api/v1/health liveness, a ready response requires a database query;
        it does not certify reconciliation, election validity or school pilot acceptance.
      responses:
        '200':
          description: Database query succeeded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, enum: [ready]}
        '503':
          description: Database unavailable; no credentials or connection details are returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/elections/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: publishElectionReport
      summary: Publish an immutable final report version
      x-implementation-status: implemented
      x-authentication: creator-session
      description: >-
        Requires the active creator role in the same school, a CSRF token, all rounds
        closed, reconciliation and reproducible recorded tallies. Pending, annulled,
        missing or divergent outcomes return report_not_ready. The same aggregate
        content replays the same version without another audit or notification.
        Changed aggregate occurrences create a new version preserving earlier versions.
        A public refresh hint is sent after commit; transport failure cannot undo publication.
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: A new report version was committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedReport'}
        '200':
          description: The same previously published version is returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedReport'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '409':
          description: report_not_ready; no report version is created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}

  /api/v1/public/elections/{id}/report:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getPublishedElectionReport
      summary: Read the current or a historical public report
      x-implementation-status: implemented
      x-authentication: public
      description: >-
        Read-only aggregate publication; never recalculates or writes votes, tallies
        or audit. Omit version for the latest report. Returns pending with a reason
        before publication or while a round remains unclosed. Cancellation returns
        annulled without winners, including for historical requests; stored versions
        remain intact. No voter identity, individual ballot, session, receipt,
        credential, operational timestamp or free-text occurrence is exposed.
        input_digest is the opaque revision announced to existing public subscriptions.
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Published version or a pending or annulled status with its reason
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PublishedReport'
                  - $ref: '#/components/schemas/ReportStatus'
        '404':
          description: not_found election or report_not_found version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API liveness and version
      description: Liveness only; this response does not certify database readiness.
      x-implementation-status: implemented
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/v1/auth/session:
    get:
      operationId: getUserSession
      summary: Read the current user session and CSRF token
      x-implementation-status: implemented
      x-authentication: optional-user-session
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate a creator or poll worker
      x-implementation-status: implemented
      x-authentication: anonymous-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-rate-limits:
        - {scope: login_account, identity: account, attempts: 10, window_seconds: 900}
        - {scope: login_ip, identity: ip, attempts: 30, window_seconds: 900}
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: End the current user session
      x-implementation-status: implemented
      x-authentication: user-session-with-csrf
      responses:
        '204':
          description: Session ended
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/parties:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listElectionParties
      summary: List parties participating in the creator's election
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: Election party catalog with canonical ballot numbers
          content:
            application/json:
              schema:
                type: object
                required: [parties]
                properties:
                  parties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Party'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createElectionParty
      summary: Create a party and its election registration atomically
      description: >-
        Requires a creator role in this election. Creates an election-owned
        record and an audit event. Abbreviation and number are unique within
        this election. Rejects changes after any round opens.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyCreateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Party and registration persisted with an audit event
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/parties/{id}:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateElectionParty
      summary: Edit an owned draft party and synchronize its registration
      description: >-
        Accepts partial party attributes. Requires ownership by this election
        and a creator role. Party, registration and audit event are updated
        atomically. Rejects changes after any round opens.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyUpdateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Updated party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: deleteElectionParty
      summary: Delete an unused owned draft party and its registration
      description: >-
        Requires a creator role. Returns 409 when the catalog is frozen or
        election data reference the party. An audit event survives successful
        deletion; a failure rolls back the complete command.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '204':
          description: Party and registration deleted with an audit event
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/federations:
    parameters:
      - name: election_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: listElectionFederations
      summary: List election federations
      description: >-
        Requires an active creator role in this election and the same school. Read only; ordered by federation ID with sorted party IDs. No CSRF header is required for this read.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: List election federations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationCatalog'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createElectionFederation
      summary: Create a federation and its members atomically
      description: >-
        Requires a creator session and CSRF header. Name is required; state defaults to active. Active federations require at least two distinct registered parties. Each party can belong to only one federation in this election. Inactive federations may have fewer members. Metadata, membership, configuration version and audit are committed together. Protected identifiers are ignored. Returns 422 invalid_configuration for invalid membership and 409 configuration_locked after any round opens.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationCreateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Create a federation and its members atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        '400':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/federations/{id}:
    parameters:
      - name: election_id
        in: path
        required: true
        schema: {type: integer}
      - name: id
        in: path
        required: true
        schema: {type: integer}
    patch:
      operationId: updateElectionFederation
      summary: Edit draft federation metadata and composition
      description: >-
        Requires a creator session and CSRF header. Accepts partial metadata; omitted party_ids preserve current membership, while provided party_ids replace it atomically. Active federations require at least two distinct registered parties, exclusive within this election. Metadata, membership, version and audit share one transaction. Protected identifiers are ignored. Returns 422 invalid_configuration for invalid composition and 409 configuration_locked after any round opens.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationUpdateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Edit draft federation metadata and composition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        '400':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: deleteElectionFederation
      summary: Delete a draft federation while preserving parties
      description: >-
        Requires a creator session and CSRF header. Removes this federation and its memberships, preserving parties and candidacies. Deletion, configuration version and attributable audit are atomic. Returns 409 configuration_locked after any round opens, or federation_in_use for protected references.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '204':
          description: Delete a draft federation while preserving parties
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/contests:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listContests
      summary: List ordered contests and candidacies
      description: Requires an active creator role in this election and the same school. Read only; ordered by configured position. Reads do not require a CSRF header.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: List ordered contests and candidacies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestCatalog'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createContest
      summary: Create a draft contest and affiliated candidacies atomically
      description: >-
        Requires a creator role in this election and registered parties.
        Rejects configuration after a round opens. The server determines the
        election and rule version; clients cannot override these fields.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestConfigurationRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Contest and candidacies persisted with an audit event
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
        default:
          $ref: '#/components/responses/ApiError'

  /api/v1/admin/elections/{election_id}/contests/{id}:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getContest
      summary: Read a contest and its candidature identities
      description: Requires an active creator role in this election and the same school. Read only; ordered by configured position. Reads do not require a CSRF header.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      responses:
        '200':
          description: Read a contest and its candidature identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    patch:
      operationId: updateContest
      summary: Edit a draft contest
      description: Requires an active creator role and CSRF token. Rejects changes after any round opens; invalid_configuration returns 422. Changes, version increment and operational audit commit atomically. Protected identifiers and state are ignored.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestUpdateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '200':
          description: Edit a draft contest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
    delete:
      operationId: deleteContest
      summary: Remove an empty draft contest
      description: Requires creator and CSRF. Configuration is locked after opening. contest_in_use returns 409 when candidacies or election data reference the contest; no implicit cascade. Deletion, version and audit commit atomically.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '204':
          description: Remove an empty draft contest
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/elections/{election_id}/contests/{contest_id}/candidacies:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: contest_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createCandidacy
      summary: Create an affiliated candidacy or slate
      description: Requires an active creator role and CSRF token. Rejects changes after any round opens; invalid_configuration returns 422. Changes, version increment and operational audit commit atomically. Protected identifiers and state are ignored. Principal and vice parties must be registered in this election. A slate requires vice_name and vice_party_id when the contest has_vice is true; parties may differ. Number is unique within the contest.
      x-implementation-status: implemented
      x-authentication: creator-session-with-csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidacyCreateRequest'
      x-rate-limits:
        - {scope: operator_commands, identity: user, attempts: 60, window_seconds: 60}
      responses:
        '201':
          description: Create an affiliated candidacy or slate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidacyWriteResult'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'

  /api/v1/admin/elections/{election_id}/contests/{contest_id}/candidacies/{id}:
    parameters:
      - name: election_id
        in: path
        required: true
        schema:
          type: integer
      - name: contest_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateCandidacy
